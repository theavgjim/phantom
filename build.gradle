plugins {
    id 'fabric-loom' version "${loom_version}" apply false
}

subprojects {
    group = project.maven_group
    version = project.client_version

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = 21
    }
}
